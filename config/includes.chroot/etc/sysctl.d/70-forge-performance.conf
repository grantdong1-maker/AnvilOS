# Forge Linux performance defaults (gaming + AI training)
# Applied at boot by sysctl; `gforge gaming` / `gforge training` tighten further.

# Graphical games and CUDA/JIT runtimes create very large numbers of mappings
vm.max_map_count = 2147483647

# Keep libraries/fonts cached; NFS/games dir churn on re-entry
vm.vfs_cache_pressure = 50

# Gaming: swap only under real pressure; training: Gemini-type stacks pin big mmap's
vm.swappiness = 10

# Large checkpoint writes: background flush early, leave the tail to the OS
vm.dirty_background_ratio = 1
vm.dirty_ratio = 40

# Training-on-fs stacks (webdataset, jsonl yields, HF datasets cache)
fs.inotify.max_user_watches = 16777216
fs.inotify.max_user_instances = 8192

# Async IO for dataloaders (aiohttp/nginx not needed; this is for exporters)
fs.aio-max-nr = 1048576

# The NMI watchdog costs a CPU core fraction; disable unless debugging hangs
kernel.nmi_watchdog = 0

# Faster first-byte HTTP for hub/git-lfs-style downloads
net.ipv4.tcp_fastopen = 3
