# AnvilOS 1.0 "Hammer" — MangoHud overlay, MSI Afterburner style.
# System-wide default: MangoHud reads $XDG_CONFIG_HOME/MangoHud/MangoHud.conf
# first, then this file, so any per-user or per-game config still wins.
# Launch anything with:  mangohud <app>   (Steam: %command% -> mangohud %command%)

### Panel: rugged slab — hard corners, wide two-column instrument layout
position=top-center
table_columns=2
background_alpha=0.82
background_color=0f1113
round_corners=0
hud_compact
text_color=ffffff
text_outline
text_outline_color=000000
text_outline_thickness=1.5
font_size=28
font_size_text=18

### GPU block — the GPU / MEM / VOLT / TEMP rows
gpu_stats
gpu_name
gpu_load
gpu_load_change=1
gpu_load_value=60,90
gpu_load_color=39f900,fdfd09,b22222
gpu_core_clock
gpu_mem_clock
gpu_voltage
gpu_temp
gpu_junction_temp
gpu_power
gpu_fan
gpu_color=d67a3c
vram
vram_color=d67a3c

### CPU block
cpu_stats
cpu_load_change=1
cpu_load_value=60,90
cpu_load_color=39f900,fdfd09,b22222
core_load
cpu_mhz
cpu_temp
cpu_power
cpu_color=c8ccd1

### Framerate
fps
fps_color_change=1
fps_value=30,60
fps_color=b22222,fdfd09
frametime
frametime_color=8b9199

### History graphs along the bottom (Afterburner's monitor strip)
graphs=gpu_load,cpu_load,gpu_core_clock,gpu_temp

### Misc
time
time_no_label
version
